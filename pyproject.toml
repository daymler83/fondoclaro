[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fondoclaro"
version = "0.1.0"
description = "Informes previsionales determinísticos, sujetos a revisión humana"
requires-python = ">=3.11"
dependencies = ["CairoSVG==2.7.1", "Pillow==11.1.0", "Jinja2==3.1.6", "jsonschema==4.23.0", "fonttools==4.57.0", "defusedxml==0.7.1"]

[project.optional-dependencies]
test = ["pytest==8.3.5", "hypothesis==6.131.9"]

[project.scripts]
fondoclaro = "fondoclaro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fondoclaro = ["render/fonts/*", "render/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
